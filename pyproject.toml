[project]
name = "kpc-llm"
version = "0.1.0"
description = "A personal LLM architecture implementation practice project"
requires-python = "==3.12.*"
dependencies = [
    "torch>=2.4.0",
    "numpy>=1.24.0",
    "transformers>=4.30.0",
    "pyyaml>=6.0",
    "pyprojroot>=0.3.0",
    "tiktoken>=0.12.0",
    # 注意：不要锁死 3.7.x，它早于 Python 3.12 发布、没有 cp312 wheel，会触发源码编译（需要 MSVC）
    "matplotlib>=3.8.0",
    "datasets>=2.14.0",
    "accelerate>=1.15.0",
    "sentencepiece>=0.2.2",
    "protobuf>=4.25.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

# 锁定 torch 走 PyTorch 官方 CUDA 索引，避免 uv 解析到 PyPI 上的 CPU-only wheel
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.basedpyright]
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"


[tool.black]
line-length = 120
target-version = ["py312"]
